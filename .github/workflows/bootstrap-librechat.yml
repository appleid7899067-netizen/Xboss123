name: Bootstrap Xboss123

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Xboss123
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap LibreChat once
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .xboss-librechat-ready ]; then
            echo "Xboss123 is already bootstrapped."
            exit 0
          fi
          git clone --depth 1 --branch v0.8.8-rc3 https://github.com/danny-avila/LibreChat.git /tmp/librechat
          rm -rf /tmp/librechat/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/librechat/. .

          # Replace the broken/missing BOSSNU hero image with a CSS typography hero.
          # The fallback is injected into the generated LibreChat UI so it survives
          # the one-time bootstrap and does not depend on an image asset.
          python3 - <<'PY'
          from pathlib import Path
          
          candidates = list(Path("client").rglob("index.html")) + list(Path(".").rglob("index.html"))
          target = next((p for p in candidates if p.is_file()), None)
          if target is None:
              raise SystemExit("No index.html found after LibreChat bootstrap")
          
          text = target.read_text(encoding="utf-8")
          marker = "<!-- XBOSS-TYPO-HERO -->"
          payload = r'''<!-- XBOSS-TYPO-HERO -->
          <style>
          .xboss-hero-type{display:grid;place-items:center;min-height:clamp(180px,28vw,360px);padding:28px 24px;box-sizing:border-box;position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(circle at 50% 35%,rgba(184,140,255,.16),transparent 58%),linear-gradient(135deg,rgba(255,255,255,.035),rgba(255,255,255,.01));}
          .xboss-hero-type::before{content:"";position:absolute;inset:12%;border:1px solid rgba(255,255,255,.08);border-radius:24px;transform:rotate(-2deg);}
          .xboss-hero-copy{position:relative;text-align:center;z-index:1;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
          .xboss-hero-name{font-size:clamp(38px,7vw,88px);line-height:.95;font-weight:900;letter-spacing:-.055em;background:linear-gradient(110deg,#fff 8%,#e8d8ff 48%,#b78cff 92%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 12px 40px rgba(143,92,255,.22);}
          .xboss-hero-sub{margin-top:12px;font-size:clamp(17px,2.5vw,30px);font-weight:650;letter-spacing:.03em;color:rgba(255,255,255,.82);}
          .xboss-hero-tag{margin-top:18px;font-size:11px;font-weight:800;letter-spacing:.28em;color:rgba(199,170,255,.78);text-transform:uppercase;}
          </style>
          <script>
          (()=>{const ALT='ภาณุพันธ์ และ สลี่ออลา • BOSSNU UNIFIED';
            const make=()=>{const box=document.createElement('div');box.className='xboss-hero-type';box.setAttribute('role','img');box.setAttribute('aria-label',ALT);box.innerHTML='<div class="xboss-hero-copy"><div class="xboss-hero-name">ภาณุพันธ์</div><div class="xboss-hero-sub">และ สลี่ออลา</div><div class="xboss-hero-tag">BOSSNU UNIFIED</div></div>';return box};
            const replace=()=>document.querySelectorAll('img').forEach(img=>{const a=(img.getAttribute('alt')||'').trim();if(a.includes('ภาณุพันธ์')||a.includes('BOSSNU UNIFIED')){if(img.parentElement&&!img.parentElement.querySelector('.xboss-hero-type'))img.replaceWith(make())}});
            const boot=()=>{replace();new MutationObserver(replace).observe(document.documentElement,{childList:true,subtree:true})};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
          })();
          </script>'''
          if marker not in text:
              insertion = payload + "\n"
              if "</head>" in text:
                  text = text.replace("</head>", insertion + "</head>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", insertion + "</body>", 1)
              else:
                  text += insertion
              target.write_text(text, encoding="utf-8")
          PY
          cat > XBOSS.md <<'EOF'
# Xboss123
Xboss123 uses LibreChat as the UI and agent foundation.
- Puter as the model/runtime provider
- MCP tool discovery and execution
- GitHub coding tools
- Autonomous Boss loop: analyze -> act -> observe -> repair -> verify
- Evidence-gated completion
EOF
          cat > librechat.yaml <<'EOF'
version: 1.0.8

# BOSSNU: Puter remains the primary model endpoint.
# Live-data questions use the built-in agent web search.
endpoints:
  custom:
    - name: "Puter"
      apiKey: "${PUTER_AUTH_TOKEN}"
      baseURL: "https://api.puter.com/puterai/openai/v1/"
      models:
        default:
          - "gpt-5.6-luna"
        fetch: true
      titleConvo: true
      titleModel: "gpt-5.6-luna"
      modelDisplayLabel: "Puter"
      dropParams:
        - "stop"
  agents:
    capabilities:
      - deferred_tools
      - execute_code
      - file_search
      - web_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - chain
      - ocr

# Keyless web search + page fetch. No extra API key is required.
webSearch:
  searchProvider: "keenable"
  scraperProvider: "keenable"
  rerankerType: "none"
  keenableSearchOptions:
    maxResults: 8
    timeout: 15000
  keenableScraperOptions:
    timeout: 15000
  safeSearch: 1
  scraperTimeout: 10000

interface:
  webSearch: true

# Default Boss profile: Puter model + automatic live web lookup.
modelSpecs:
  prioritize: false
  list:
    - name: "boss-live"
      label: "BOSS • Live"
      default: true
      description: "Puter-first Boss with automatic live web lookup for current facts."
      webSearch: true
      artifacts: true
      preset:
        endpoint: "Puter"
        model: "gpt-5.6-luna"
        promptPrefix: |
          You are BOSSNU. For time-sensitive factual questions, do not rely on memory alone.
          Use web search before answering. For Thai gold prices, prefer the Gold Traders Association
          (สมาคมค้าทองคำ) as the primary source, then cross-check a reputable Thai source when available.
          Always state the source time/date when the price can change during the day.
          Never invent a live price.
EOF
          if ! grep -q '^PUTER_AUTH_TOKEN=' .env.example 2>/dev/null; then
            printf '\n# Puter OpenAI-compatible AI endpoint\nPUTER_AUTH_TOKEN=\n' >> .env.example
          fi
          touch .xboss-librechat-ready
          git config user.name "Xboss123 Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap Xboss123 from LibreChat [skip ci]"
          git push origin main
