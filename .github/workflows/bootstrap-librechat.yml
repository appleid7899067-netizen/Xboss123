name: Bootstrap Xboss123

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !hashFiles('.xboss-librechat-ready') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Xboss123
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch LibreChat
        run: |
          git clone --depth 1 --branch v0.8.8-rc3 https://github.com/danny-avila/LibreChat.git /tmp/librechat
          rm -rf /tmp/librechat/.git

      - name: Install LibreChat as the app base
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/librechat/. .
          cat > XBOSS.md <<'EOF'
          # Xboss123

          Xboss123 uses the current LibreChat application as its UI and agent foundation.

          Target integration:
          - Puter as the model/runtime provider
          - MCP tool discovery and execution
          - GitHub coding tools
          - Autonomous Boss loop: analyze -> act -> observe -> repair -> verify
          - Evidence-gated completion

          This repository intentionally keeps the upstream LibreChat architecture instead of rebuilding a ChatGPT-style UI from scratch.
          EOF
          cat > librechat.yaml <<'EOF'
version: 1.0.8

endpoints:
  custom:
    - name: "Puter"
      apiKey: "${PUTER_AUTH_TOKEN}"
      baseURL: "https://api.puter.com/puterai/openai/v1/"
      models:
        default:
          - "gpt-5.6-luna"
        fetch: true
      titleConvo: true
      titleModel: "gpt-5.6-luna"
      modelDisplayLabel: "Puter"
      dropParams:
        - "stop"
EOF

          cat >> .env.example <<'EOF'

# Puter OpenAI-compatible AI endpoint
PUTER_AUTH_TOKEN=
EOF

          touch .xboss-librechat-ready

      - name: Commit bootstrapped app
        run: |
          git config user.name "Xboss123 Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap Xboss123 from LibreChat [skip ci]"
          git push origin main
